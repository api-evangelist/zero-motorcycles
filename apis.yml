aid: zero-motorcycles
name: Zero Motorcycles
description: 'Zero Motorcycles is an American manufacturer of electric motorcycles
  and powertrains, founded in 2006 in Santa Cruz, California. It designs and builds
  street, dual-sport and off-road electric motorcycles across its S, DS, FX and X
  lines — including the SR/S, SR/F, DSR/X, FXE and XE — around a proprietary Z-Force
  electric powertrain and aircraft-grade aluminum frame. Its bikes run the Cypher
  operating system, which pairs with the Zero Motorcycles NextGen mobile app over
  Bluetooth and cellular telematics for ride data, remote diagnostics, over-the-air
  updates and performance customization, and with the Cypher Store, where owners
  purchase software upgrades that unlock additional power, top speed and features.
  Zero sells internationally through a dealer network and serves retail, fleet and
  authority/first-responder segments. Its connected-vehicle platform is consumer-facing
  only: Zero publishes no public developer program, API documentation, SDKs or
  machine-readable specification.'
